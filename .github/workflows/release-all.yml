name: Build All Platforms (Win / macOS / Linux / Android / iOS)

# Compile-time assets are fetched transiently via private secrets (RMEXE_ASSETS_URL + optional
# RMEXE_ASSETS_PASS / RMEXE_ASSETS_TOKEN) so AOT static recompilation can run in CI.
# Released packages NEVER bundle copyrighted .jar/.sp files unless bundle_user_roms=true
# is explicitly requested for a personal debug build; end users supply their own .jar/.sp.

on:
  workflow_dispatch:
    inputs:
      bundle_user_roms:
        description: "Personal debug only: bundle .jar/.sp into mobile packages (keep false for public releases)"
        required: false
        default: "false"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  SDL2_VERSION: "2.30.11"

jobs:
  # =========================================================================
  # 1. Linux x86_64
  # =========================================================================
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev zlib1g-dev python3 openssl curl
      - name: Fetch compile-time assets (if RMEXE_ASSETS_URL secret is set)
        env:
          ASSETS_URL: ${{ secrets.RMEXE_ASSETS_URL }}
          ASSETS_PASS: ${{ secrets.RMEXE_ASSETS_PASS }}
          ASSETS_TOKEN: ${{ secrets.RMEXE_ASSETS_TOKEN }}
        run: |
          if [ -n "$ASSETS_URL" ]; then
            AUTH_ARGS=()
            [ -n "$ASSETS_TOKEN" ] && AUTH_ARGS=(-H "Authorization: Bearer $ASSETS_TOKEN" -H "Accept: application/octet-stream")
            curl -fL --retry 3 "${AUTH_ARGS[@]}" -o /tmp/rmexe_assets.bin "$ASSETS_URL"
            if [ -n "$ASSETS_PASS" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ASSETS_PASS -in /tmp/rmexe_assets.bin | tar -xzf -
            else
              tar -xzf /tmp/rmexe_assets.bin
            fi
            rm -f /tmp/rmexe_assets.bin
          fi
      - name: Run contract checks & build
        run: |
          python3 tools/gate.py --check-only
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Run quick PvP self-tests (when ROMs present)
        run: |
          if [ -x build/pon_jp_recomp ] || [ -x build/lon_jp_recomp ]; then
            python3 tools/gate.py --quick
          fi
      - name: Package Linux artifact (no copyrighted .jar/.sp)
        run: |
          mkdir -p dist/rmexe-linux-x64/assets
          cp build/rmexe_server dist/rmexe-linux-x64/
          for bin in pon_jp_recomp pon_en_recomp lon_jp_recomp lon_en_recomp; do
            [ -x "build/$bin" ] && cp "build/$bin" dist/rmexe-linux-x64/
          done
          cp -r assets/fonts assets/translations dist/rmexe-linux-x64/assets/ 2>/dev/null || true
          tar -czf dist/rmexe-mobile-recomp-linux-x86_64.tar.gz -C dist rmexe-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: rmexe-linux-x86_64
          path: dist/rmexe-mobile-recomp-linux-x86_64.tar.gz

  # =========================================================================
  # 2. Windows x64 (MSVC)
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SDL2 VC dev & zlib source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.SDL2_VERSION }}/SDL2-devel-${{ env.SDL2_VERSION }}-VC.zip" -OutFile third_party/sdl2.zip
          Expand-Archive -Path third_party/sdl2.zip -DestinationPath third_party -Force
          Invoke-WebRequest -Uri "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz" -OutFile third_party/zlib.tar.gz
          tar -xzf third_party/zlib.tar.gz -C third_party
      - name: Fetch compile-time assets (if RMEXE_ASSETS_URL secret is set)
        shell: bash
        env:
          ASSETS_URL: ${{ secrets.RMEXE_ASSETS_URL }}
          ASSETS_PASS: ${{ secrets.RMEXE_ASSETS_PASS }}
          ASSETS_TOKEN: ${{ secrets.RMEXE_ASSETS_TOKEN }}
        run: |
          if [ -n "$ASSETS_URL" ]; then
            AUTH_ARGS=()
            [ -n "$ASSETS_TOKEN" ] && AUTH_ARGS=(-H "Authorization: Bearer $ASSETS_TOKEN" -H "Accept: application/octet-stream")
            curl -fL --retry 3 "${AUTH_ARGS[@]}" -o /tmp/rmexe_assets.bin "$ASSETS_URL"
            if [ -n "$ASSETS_PASS" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ASSETS_PASS -in /tmp/rmexe_assets.bin | tar -xzf -
            else
              tar -xzf /tmp/rmexe_assets.bin
            fi
            rm -f /tmp/rmexe_assets.bin
          fi
      - name: Configure & Build Windows x64
        shell: pwsh
        run: |
          $sdlDir = (Resolve-Path "third_party/SDL2-${{ env.SDL2_VERSION }}").Path
          $zlibDir = (Resolve-Path "third_party/zlib-1.3.1").Path
          cmake -B build -A x64 `
            -DSDL2_INCLUDE_DIR="$sdlDir/include" `
            -DSDL2_LIBRARY="$sdlDir/lib/x64/SDL2.lib" `
            -DZLIB_SOURCE_DIR="$zlibDir"
          cmake --build build --config Release --parallel
      - name: Package Windows artifact (no copyrighted .jar/.sp)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/rmexe-win64/assets | Out-Null
          Copy-Item build/Release/*.exe dist/rmexe-win64/
          Copy-Item "third_party/SDL2-${{ env.SDL2_VERSION }}/lib/x64/SDL2.dll" dist/rmexe-win64/
          if (Test-Path assets/fonts) { Copy-Item -Recurse assets/fonts dist/rmexe-win64/assets/ }
          if (Test-Path assets/translations) { Copy-Item -Recurse assets/translations dist/rmexe-win64/assets/ }
          Compress-Archive -Path dist/rmexe-win64 -DestinationPath dist/rmexe-mobile-recomp-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: rmexe-win64
          path: dist/rmexe-mobile-recomp-win64.zip

  # =========================================================================
  # 3. macOS arm64
  # =========================================================================
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 via Homebrew
        run: brew install sdl2 cmake ninja
      - name: Fetch compile-time assets (if RMEXE_ASSETS_URL secret is set)
        env:
          ASSETS_URL: ${{ secrets.RMEXE_ASSETS_URL }}
          ASSETS_PASS: ${{ secrets.RMEXE_ASSETS_PASS }}
          ASSETS_TOKEN: ${{ secrets.RMEXE_ASSETS_TOKEN }}
        run: |
          if [ -n "$ASSETS_URL" ]; then
            AUTH_ARGS=()
            [ -n "$ASSETS_TOKEN" ] && AUTH_ARGS=(-H "Authorization: Bearer $ASSETS_TOKEN" -H "Accept: application/octet-stream")
            curl -fL --retry 3 "${AUTH_ARGS[@]}" -o /tmp/rmexe_assets.bin "$ASSETS_URL"
            if [ -n "$ASSETS_PASS" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ASSETS_PASS -in /tmp/rmexe_assets.bin | tar -xzf -
            else
              tar -xzf /tmp/rmexe_assets.bin
            fi
            rm -f /tmp/rmexe_assets.bin
          fi
      - name: Build macOS arm64
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Package macOS artifact (no copyrighted .jar/.sp)
        run: |
          mkdir -p dist/rmexe-macos-arm64/assets
          cp build/rmexe_server dist/rmexe-macos-arm64/
          for bin in pon_jp_recomp pon_en_recomp lon_jp_recomp lon_en_recomp; do
            [ -x "build/$bin" ] && cp "build/$bin" dist/rmexe-macos-arm64/
          done
          cp -r assets/fonts assets/translations dist/rmexe-macos-arm64/assets/ 2>/dev/null || true
          tar -czf dist/rmexe-mobile-recomp-macos-arm64.tar.gz -C dist rmexe-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: rmexe-macos-arm64
          path: dist/rmexe-mobile-recomp-macos-arm64.tar.gz

  # =========================================================================
  # 4. Android arm64-v8a Collection APK (user supplies .jar/.sp at runtime)
  # =========================================================================
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android NDK 26.3.11579264 & CMake 3.22.1
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Download SDL2 source
        run: |
          mkdir -p third_party
          curl -fL --retry 3 -o /tmp/SDL2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar -xzf /tmp/SDL2.tar.gz -C third_party
          mv "third_party/SDL2-${SDL2_VERSION}" third_party/SDL2
      - name: Fetch compile-time assets (if RMEXE_ASSETS_URL secret is set)
        env:
          ASSETS_URL: ${{ secrets.RMEXE_ASSETS_URL }}
          ASSETS_PASS: ${{ secrets.RMEXE_ASSETS_PASS }}
          ASSETS_TOKEN: ${{ secrets.RMEXE_ASSETS_TOKEN }}
        run: |
          if [ -n "$ASSETS_URL" ]; then
            AUTH_ARGS=()
            [ -n "$ASSETS_TOKEN" ] && AUTH_ARGS=(-H "Authorization: Bearer $ASSETS_TOKEN" -H "Accept: application/octet-stream")
            curl -fL --retry 3 "${AUTH_ARGS[@]}" -o /tmp/rmexe_assets.bin "$ASSETS_URL"
            if [ -n "$ASSETS_PASS" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ASSETS_PASS -in /tmp/rmexe_assets.bin | tar -xzf -
            else
              tar -xzf /tmp/rmexe_assets.bin
            fi
            rm -f /tmp/rmexe_assets.bin
          fi
      - name: Build Android Collection APK (when compile-time .jar present)
        run: |
          if [ -f assets/PoN_jp/bin/PoN.jar ] || [ -f assets/LoN_jp/bin/LoN.jar ]; then
            BUNDLE_FLAG=""
            if [ "${{ github.event.inputs.bundle_user_roms }}" = "true" ]; then
              BUNDLE_FLAG="-PbundleUserRoms=true"
            fi
            (cd android && gradle assembleDebug $BUNDLE_FLAG --no-daemon)
            mkdir -p dist
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/rmexe-collection-android-arm64.apk
          else
            echo "SKIP: No compile-time .jar files present (set RMEXE_ASSETS_URL secret to build full APK)."
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/rmexe-collection-android-arm64.apk') != '' }}
        with:
          name: rmexe-android-arm64-apk
          path: dist/rmexe-collection-android-arm64.apk

  # =========================================================================
  # 5. iOS arm64 Collection IPA for AltStore (user supplies .jar/.sp via Files app)
  # =========================================================================
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compile-time assets (if RMEXE_ASSETS_URL secret is set)
        env:
          ASSETS_URL: ${{ secrets.RMEXE_ASSETS_URL }}
          ASSETS_PASS: ${{ secrets.RMEXE_ASSETS_PASS }}
          ASSETS_TOKEN: ${{ secrets.RMEXE_ASSETS_TOKEN }}
        run: |
          if [ -n "$ASSETS_URL" ]; then
            AUTH_ARGS=()
            [ -n "$ASSETS_TOKEN" ] && AUTH_ARGS=(-H "Authorization: Bearer $ASSETS_TOKEN" -H "Accept: application/octet-stream")
            curl -fL --retry 3 "${AUTH_ARGS[@]}" -o /tmp/rmexe_assets.bin "$ASSETS_URL"
            if [ -n "$ASSETS_PASS" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ASSETS_PASS -in /tmp/rmexe_assets.bin | tar -xzf -
            else
              tar -xzf /tmp/rmexe_assets.bin
            fi
            rm -f /tmp/rmexe_assets.bin
          fi
      - name: Build iOS AltStore IPA (when compile-time .jar present)
        run: |
          if [ -f assets/PoN_jp/bin/PoN.jar ] || [ -f assets/LoN_jp/bin/LoN.jar ]; then
            chmod +x ios/build_ipa.sh
            BUNDLE_USER_ROMS="$( [ "${{ github.event.inputs.bundle_user_roms }}" = "true" ] && echo 1 || echo 0 )" ./ios/build_ipa.sh
          else
            echo "SKIP: No compile-time .jar files present (set RMEXE_ASSETS_URL secret to build full IPA)."
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/rmexe-collection-ios-altstore.ipa') != '' }}
        with:
          name: rmexe-ios-arm64-ipa
          path: dist/rmexe-collection-ios-altstore.ipa
